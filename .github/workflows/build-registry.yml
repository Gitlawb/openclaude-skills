name: Build registry

on:
  pull_request:
    paths:
      - 'skills/**'
      - '.maintainers/**'
      - 'packages/**'
      - 'scripts/**'
      - 'registry.json'
      - 'revocations.json'
      - '.github/workflows/build-registry.yml'

permissions:
  contents: read

jobs:
  build:
    name: Rebuild registry.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build validator
        run: bun run --filter '@gitlawb/skill-validator' build
      - name: Rebuild registry
        run: bun run build:registry
      - name: Fail if registry.json is stale
        run: |
          if ! git diff --exit-code registry.json; then
            echo "::error::registry.json is out of date. Run \`bun run build:registry\` locally and commit the result."
            exit 1
          fi
