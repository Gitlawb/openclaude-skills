# Publishes @gitlawb/skill-validator to npm whenever a tag matching
# `validator-v*` is pushed. Requires the NPM_TOKEN secret to be set
# in the repository settings (Settings → Secrets and variables →
# Actions → New repository secret).
name: Release validator

on:
  push:
    tags:
      - 'validator-v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build validator
        run: bun run --filter '@gitlawb/skill-validator' build
      - name: Publish
        working-directory: packages/validator
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
