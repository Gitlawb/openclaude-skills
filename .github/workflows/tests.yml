name: Tests

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'skills/**'
      - 'package.json'
      - 'bun.lock'
      - 'vitest.root.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.scripts.json'
      - '.github/workflows/tests.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'skills/**'
      - 'package.json'
      - 'bun.lock'
      - 'vitest.root.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.scripts.json'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  test:
    name: Validator + script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build validator
        run: bun run --filter '@gitlawb/skill-validator' build
      - name: Typecheck
        run: bun run lint
      - name: Validator tests
        run: bun run --filter '@gitlawb/skill-validator' test
      - name: Root script + consumer integration tests
        run: bun x vitest run --config vitest.root.config.ts
