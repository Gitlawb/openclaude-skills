name: Validate skills

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

jobs:
  matrix:
    name: Discover skills
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.list.outputs.skills }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        name: Enumerate skill folders
        run: |
          set -euo pipefail
          if [ -d skills ]; then
            mapfile -t names < <(find skills -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          else
            names=()
          fi
          if [ "${#names[@]}" -eq 0 ]; then
            echo "skills=[]" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "${names[@]}" | jq -R . | jq -s -c . > /tmp/skills.json
            echo "skills=$(cat /tmp/skills.json)" >> "$GITHUB_OUTPUT"
            echo "count=${#names[@]}" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Validate ${{ matrix.skill }}
    needs: matrix
    if: needs.matrix.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.matrix.outputs.skills) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build validator
        run: bun run --filter '@gitlawb/skill-validator' build
      - name: Validate skill
        run: bun run scripts/validate-skill.ts skills/${{ matrix.skill }}/
